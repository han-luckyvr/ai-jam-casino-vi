<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HUD V1 · Stadium Scoreboard</title>
<style>
  :root {
    --bg: #000;
    --cream: #fff4db;
    --magenta: #fb009f;
    --cyan: #2aeaff;
    --yellow: #ffe054;
    --muted: rgba(255, 244, 219, 0.62);
    --rule: rgba(255, 244, 219, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; background: var(--bg); color: var(--cream); font-family: 'Montserrat', system-ui, sans-serif; font-weight: 300; overflow-x: hidden; }

  /* ===== Scene shell (shared across mockups) ===== */
  .scene { position: relative; min-height: 100vh; width: 100%; overflow: hidden; }
  .scene-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 60%; z-index: 0; }
  .field { position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 140px 24px 56px; }

  /* Strike zone silhouette */
  .zone-wrap { position: relative; width: min(380px, 70vw); height: min(380px, 70vw); }
  .zone-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    width: 100%; height: 100%;
    border: 2px solid rgba(42,234,255,0.7);
    box-shadow: inset 0 0 20px rgba(42,234,255,0.18), 0 0 18px rgba(42,234,255,0.22);
    background-image: repeating-linear-gradient(0deg, transparent 0 3px, rgba(42,234,255,0.04) 3px 4px);
  }
  .zone-cell { border-right: 1px solid rgba(42,234,255,0.38); border-bottom: 1px solid rgba(42,234,255,0.38); }
  .zone-cell:nth-child(3n) { border-right: 0; }
  .zone-cell:nth-child(n+7) { border-bottom: 0; }
  .marker { position: absolute; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--cyan); background: rgba(0,0,0,0.7); box-shadow: 0 0 6px rgba(42,234,255,0.65); transform: translate(-50%, -50%); }

  /* Chip rack */
  .chip-rack { display: flex; gap: 16px; align-items: center; }
  .chip { width: 56px; height: 56px; border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 13px; box-shadow: 0 4px 10px rgba(0,0,0,0.55), inset 0 -4px 0 rgba(0,0,0,0.22); cursor: pointer; }
  .chip-1 { background: var(--cream); color: #000; }
  .chip-5 { background: var(--cyan); color: #000; transform: scale(1.08); box-shadow: 0 4px 10px rgba(0,0,0,0.55), inset 0 -4px 0 rgba(0,0,0,0.22), 0 0 0 3px rgba(42,234,255,0.5); }
  .chip-25 { background: var(--magenta); color: var(--cream); }
  .chip-100 { background: var(--yellow); color: #000; }
  .chip-clear { background: transparent; border: 1px solid var(--rule); color: var(--muted); padding: 10px 22px; border-radius: 999px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; font-family: 'Montserrat', sans-serif; cursor: pointer; }
  .throw-btn { background: var(--magenta); color: var(--cream); border: 1px solid var(--cream); padding: 16px 36px; border-radius: 999px; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; box-shadow: 0 0 24px rgba(251,0,159,0.45); cursor: pointer; }

  /* Footer chrome */
  .back-link { position: fixed; bottom: 14px; left: 14px; z-index: 20; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 6px; background: rgba(12,10,31,0.7); backdrop-filter: blur(4px); }
  .label-tag { position: fixed; bottom: 14px; right: 14px; z-index: 20; color: var(--muted); font-weight: 700; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 6px; background: rgba(12,10,31,0.7); backdrop-filter: blur(4px); }

  /* ===== V1: Stadium Scoreboard ===== */
  .scoreboard {
    position: fixed; top: 0; left: 0; right: 0;
    height: 104px;
    z-index: 10;
    background: linear-gradient(180deg, #5a5a5a 0%, #2a2a2a 60%, #3a3a3a 100%);
    border-bottom: 5px solid #0e0e0e;
    box-shadow: 0 6px 22px rgba(0,0,0,0.75);
    display: grid;
    grid-template-columns: 1fr 1.7fr 1fr;
    gap: 6px;
    padding: 6px;
  }
  .sb-panel {
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    border-radius: 4px;
    padding: 10px 14px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
    box-shadow: inset 0 0 24px rgba(0,0,0,0.9), inset 0 2px 0 rgba(255,255,255,0.06);
  }
  .sb-panel.center { background: #050505; border-color: #444; }
  .sb-rivet { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #999, #2a2a2a); box-shadow: inset 0 -1px 0 rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.1); }
  .sb-rivet.tl { top: 5px; left: 5px; }
  .sb-rivet.tr { top: 5px; right: 5px; }
  .sb-rivet.bl { bottom: 5px; left: 5px; }
  .sb-rivet.br { bottom: 5px; right: 5px; }

  .sb-eyebrow {
    color: var(--cream); font-size: 9px; font-weight: 800;
    letter-spacing: 0.32em; text-transform: uppercase;
    margin-bottom: 4px;
    text-shadow: 0 1px 0 rgba(0,0,0,0.7);
    opacity: 0.78;
  }
  .sb-eyebrow.gold { color: var(--yellow); font-size: 10px; opacity: 1; text-shadow: 0 0 8px rgba(255,224,84,0.55); }
  .sb-eyebrow .star { color: var(--yellow); margin: 0 8px; }

  .sb-digits {
    font-family: 'Courier New', ui-monospace, monospace;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.08em;
    color: #ff8c1a;
    text-shadow:
      0 0 6px rgba(255,140,26,0.95),
      0 0 14px rgba(255,140,26,0.6),
      0 0 24px rgba(255,80,0,0.4);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .sb-digits.jumbo {
    font-size: 48px;
    color: #ff3320;
    text-shadow:
      0 0 8px rgba(255,80,40,1),
      0 0 18px rgba(255,80,0,0.85),
      0 0 36px rgba(255,140,26,0.55);
  }

  /* Chasing bulbs around the jackpot panel */
  .bulb-row { position: absolute; left: 14px; right: 14px; display: flex; justify-content: space-between; pointer-events: none; }
  .bulb-row.top { top: 3px; }
  .bulb-row.bottom { bottom: 3px; }
  .bulb { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,200,80,0.25); animation: chase 1.6s linear infinite; }
  @keyframes chase {
    0%, 100% { background: rgba(255,200,80,0.2); box-shadow: 0 0 1px rgba(255,200,80,0.3); }
    18%      { background: rgba(255,224,84,1); box-shadow: 0 0 8px rgba(255,224,84,1), 0 0 14px rgba(255,140,26,0.5); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bulb { animation: none; background: rgba(255,200,80,0.6); }
  }

  @media (max-width: 600px) {
    .scoreboard { height: 88px; }
    .sb-digits { font-size: 22px; }
    .sb-digits.jumbo { font-size: 32px; }
    .sb-eyebrow { font-size: 8px; letter-spacing: 0.24em; }
    .sb-eyebrow.gold { font-size: 9px; }
    .field { padding-top: 116px; gap: 22px; }
  }
</style>
</head>
<body>
<div class="scene">
  <img class="scene-bg" src="/assets/IMG-03.jpg" alt="" aria-hidden="true" />

        <span class="bulb" style="animation-delay:0.24s"></span>

      <div class="sb-eyebrow gold"><span class="star">★</span>Progressive Jackpot<span class="star">★</span></div>
