<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Count Overlay V5 · TBS Postseason</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: "Inter", system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }

  /* ===== Faux TV scene ===== */
  .scene { position: fixed; inset: 0; overflow: hidden; }
  .sky { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 60% at 50% 90%, #0c1f0c 0%, #050b05 60%, #000 100%), linear-gradient(180deg, #0a1228 0%, #050811 55%, #000 100%); }
  .grass { position: absolute; left: -10%; right: -10%; bottom: 0; height: 62%; background: radial-gradient(ellipse 70% 80% at 50% 100%, #2a5a30 0%, #1d4022 40%, #0e2412 75%, transparent 100%); }
  .infield { position: absolute; left: 50%; bottom: 0; width: 95%; height: 38%; transform: translateX(-50%); background: radial-gradient(ellipse 60% 90% at 50% 100%, #7b5a35 0%, #5a3f22 50%, transparent 75%); opacity: 0.55; }
  .mound { position: absolute; left: 50%; bottom: 32%; transform: translateX(-50%); width: 230px; height: 56px; background: radial-gradient(ellipse, #8a6840 0%, #5a3f22 70%, transparent 100%); opacity: 0.7; filter: blur(2px); }
  .foul-line-l, .foul-line-r { position: absolute; bottom: 0; width: 2px; height: 56%; background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.5) 60%, rgba(255,255,255,0.85) 100%); transform-origin: bottom center; }
  .foul-line-l { left: 50%; transform: rotate(-32deg); }
  .foul-line-r { left: 50%; transform: rotate(32deg); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%); pointer-events: none; }
  .pitcher-tag { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 500; letter-spacing: 0.18em; color: rgba(255,255,255,0.45); text-transform: uppercase; }
  .pitcher-tag b { color: rgba(255,255,255,0.75); font-weight: 700; margin: 0 8px; }

  /* ===== V5: TBS Postseason ===== */
  .tbs-bug {
    position: fixed;
    bottom: 48px; left: 48px;
    width: 280px;
    background: linear-gradient(180deg, #0d0d0f 0%, #050507 100%);
    border: 1px solid rgba(212, 175, 55, 0.35);
    border-radius: 4px;
    overflow: hidden;
    box-shadow:
      0 16px 36px rgba(0,0,0,0.65),
      0 0 0 1px rgba(0,0,0,0.6),
      0 0 24px rgba(212,175,55,0.18);
    font-family: "Inter", sans-serif;
  }
  /* Gold eyebrow strip */
  .tbs-eyebrow {
    background: linear-gradient(90deg, #1a1306 0%, #3a2a10 50%, #1a1306 100%);
    border-bottom: 1px solid rgba(212, 175, 55, 0.55);
    padding: 6px 14px 5px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .tbs-postseason {
    font-family: "Inter", sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #d4af37;
    text-shadow: 0 0 8px rgba(212,175,55,0.4);
  }
  .tbs-postseason::before {
    content: "★"; margin-right: 6px;
    color: #d4af37;
    font-size: 8px;
    vertical-align: 2px;
  }
  .tbs-tbs {
    font-family: "Anton", "Inter", sans-serif;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 0.18em;
    color: #d4af37;
  }

  /* Main body: inning + count */
  .tbs-body {
    display: flex; align-items: stretch;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.02) 0%, transparent 100%),
      linear-gradient(180deg, #0d0d0f 0%, #050507 100%);
  }
  /* Big inning indicator on left */
  .tbs-inning {
    flex: 0 0 90px;
    padding: 14px 12px 14px 16px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: flex-start;
    border-right: 1px solid rgba(212,175,55,0.25);
    background: linear-gradient(180deg, rgba(212,175,55,0.04) 0%, transparent 100%);
  }
  .tbs-inning-label {
    font-family: "Inter", sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: #d4af37;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .tbs-inning-num {
    display: flex; align-items: baseline; gap: 6px;
    font-family: "Anton", "Inter", sans-serif;
    font-size: 44px;
    font-weight: 400;
    line-height: 0.9;
    color: #fff;
    letter-spacing: -0.01em;
  }
  .tbs-arrow {
    font-size: 16px;
    color: #d4af37;
    line-height: 1;
    transform: translateY(-4px);
  }
  /* Right: count stack */
  .tbs-count {
    flex: 1;
    padding: 12px 14px 12px 14px;
    display: flex; flex-direction: column;
    gap: 6px; justify-content: center;
  }
  .tbs-row {
    display: flex; align-items: center; justify-content: space-between;
  }
  .tbs-row-label {
    font-family: "Inter", sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
  }
  .tbs-dots { display: flex; gap: 5px; }
  .tbs-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
  }
  .tbs-dot.on {
    background: linear-gradient(180deg, #f4d36a 0%, #d4af37 100%);
    border-color: #d4af37;
    box-shadow: 0 0 8px rgba(212,175,55,0.7), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  /* Subtle bottom gold accent */
  .tbs-foot-accent {
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, #d4af37 30%, #f4d36a 50%, #d4af37 70%, transparent 100%);
    opacity: 0.7;
  }

  /* ===== Footer chrome ===== */
  .back { position: fixed; top: 24px; right: 24px; color: rgba(255,255,255,0.55); text-decoration: none; font-size: 10px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; padding: 8px 14px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 100; }
  .back:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
  .variant-tag { position: fixed; top: 14px; left: 14px; color: rgba(255,255,255,0.4); font-size: 10px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; padding: 6px 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; }
</style>
</head>
<body>
  <div class="scene">
    <div class="sky"></div>
    <div class="grass"></div>
    <div class="infield"></div>
    <div class="mound"></div>
    <div class="foul-line-l"></div>
    <div class="foul-line-r"></div>
    <div class="vignette"></div>
    <div class="pitcher-tag">Pitcher <b>M. SCHERZER</b> · 4-Seam · <b>97 MPH</b></div>
  </div>

  <a class="back" href="index.html">← Back</a>
  <div class="variant-tag">V5 · TBS Postseason</div>

  <!-- TBS Postseason count overlay -->
  <div class="tbs-bug" aria-label="Top of 7th, 2 balls, 1 strike, 1 out">
    <div class="tbs-eyebrow">
      <span class="tbs-postseason">MLB Postseason</span>
      <span class="tbs-tbs">TBS</span>
    </div>
    <div class="tbs-body">
      <div class="tbs-inning">
        <span class="tbs-inning-label">Top</span>
        <div class="tbs-inning-num">
          <span class="tbs-arrow">▲</span>
          <span>7</span>
        </div>
      </div>
      <div class="tbs-count">
        <div class="tbs-row">
          <span class="tbs-row-label">Balls</span>
          <div class="tbs-dots">
            <span class="tbs-dot on"></span>
            <span class="tbs-dot on"></span>
            <span class="tbs-dot"></span>
          </div>
        </div>
        <div class="tbs-row">
          <span class="tbs-row-label">Strikes</span>
          <div class="tbs-dots">
            <span class="tbs-dot on"></span>
            <span class="tbs-dot"></span>
          </div>
        </div>
        <div class="tbs-row">
          <span class="tbs-row-label">Outs</span>
          <div class="tbs-dots">
            <span class="tbs-dot on"></span>
            <span class="tbs-dot"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="tbs-foot-accent"></div>
  </div>
</body>
</html>
