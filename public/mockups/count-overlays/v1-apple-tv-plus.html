<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Count Overlay V1 · Apple TV+ Friday Night Baseball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #fff;
  }

  /* ===== Faux TV scene ===== */
  .scene { position: fixed; inset: 0; overflow: hidden; }
  .sky {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 90% 60% at 50% 90%, #0c1f0c 0%, #050b05 60%, #000 100%),
      linear-gradient(180deg, #0a1228 0%, #050811 55%, #000 100%);
  }
  .grass {
    position: absolute; left: -10%; right: -10%; bottom: 0; height: 62%;
    background:
      radial-gradient(ellipse 70% 80% at 50% 100%, #2a5a30 0%, #1d4022 40%, #0e2412 75%, transparent 100%);
    filter: brightness(0.95);
  }
  .infield {
    position: absolute; left: 50%; bottom: 0; width: 95%; height: 38%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse 60% 90% at 50% 100%, #7b5a35 0%, #5a3f22 50%, transparent 75%);
    opacity: 0.55;
  }
  .mound {
    position: absolute; left: 50%; bottom: 32%;
    transform: translateX(-50%);
    width: 230px; height: 56px;
    background: radial-gradient(ellipse, #8a6840 0%, #5a3f22 70%, transparent 100%);
    opacity: 0.7;
    filter: blur(2px);
  }
  .foul-line-l, .foul-line-r {
    position: absolute; bottom: 0; width: 2px; height: 56%;
    background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.5) 60%, rgba(255,255,255,0.85) 100%);
    transform-origin: bottom center;
  }
  .foul-line-l { left: 50%; transform: rotate(-32deg); }
  .foul-line-r { left: 50%; transform: rotate(32deg); }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
    pointer-events: none;
  }
  .pitcher-tag {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-weight: 500; letter-spacing: 0.18em;
    color: rgba(255,255,255,0.45);
    text-transform: uppercase;
  }
  .pitcher-tag b { color: rgba(255,255,255,0.75); font-weight: 600; margin: 0 8px; }

  /* ===== V1: Apple TV+ overlay ===== */
  .atv-bug {
    position: fixed; top: 28px; left: 28px;
    display: flex; align-items: stretch;
    background: rgba(248, 248, 250, 0.88);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border-radius: 16px;
    border: 0.5px solid rgba(255,255,255,0.6);
    box-shadow:
      0 10px 30px rgba(0,0,0,0.35),
      0 2px 8px rgba(0,0,0,0.18),
      inset 0 0.5px 0 rgba(255,255,255,0.8);
    overflow: hidden;
    color: #0a0a0a;
    font-feature-settings: "tnum" 1;
  }
  .atv-section {
    padding: 10px 16px;
    display: flex; flex-direction: column;
    justify-content: center;
    border-right: 0.5px solid rgba(0,0,0,0.1);
  }
  .atv-section:last-child { border-right: 0; }
  .atv-inning {
    flex-direction: row; align-items: center; gap: 6px;
    padding: 10px 14px 10px 18px;
  }
  .atv-arrow {
    font-size: 12px; color: #d22; line-height: 1;
    transform: translateY(-1px);
  }
  .atv-arrow.bot { color: #555; transform: translateY(1px); }
  .atv-inning-num {
    font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
    line-height: 1;
  }
  .atv-label {
    font-size: 9px; font-weight: 600; letter-spacing: 0.14em;
    color: rgba(0,0,0,0.45);
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .atv-dots { display: flex; gap: 5px; align-items: center; }
  .atv-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(0,0,0,0.12);
  }
  .atv-dot.on-ball { background: #1aa84a; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.06); }
  .atv-dot.on-strike { background: #f5b500; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.06); }
  .atv-dot.on-out { background: #d62828; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.06); }

  /* ===== Footer chrome ===== */
  .back {
    position: fixed; top: 24px; right: 24px;
    color: rgba(255,255,255,0.55);
    text-decoration: none;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase;
    padding: 8px 14px;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(8px);
    z-index: 100;
  }
  .back:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
  .variant-tag {
    position: fixed; bottom: 14px; right: 14px;
    color: rgba(255,255,255,0.4);
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase;
    padding: 6px 12px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="sky"></div>
    <div class="grass"></div>
    <div class="infield"></div>
    <div class="mound"></div>
    <div class="foul-line-l"></div>
    <div class="foul-line-r"></div>
    <div class="vignette"></div>
    <div class="pitcher-tag">Pitcher <b>M. SCHERZER</b> · 4-Seam · <b>97 MPH</b></div>
  </div>

  <a class="back" href="index.html">← Back</a>
  <div class="variant-tag">V1 · Apple TV+</div>

  <!-- Apple TV+ Friday Night Baseball count overlay -->
  <div class="atv-bug" aria-label="Top of 7th, 2 balls, 1 strike, 1 out">
    <div class="atv-section atv-inning">
      <span class="atv-arrow top">▲</span>
      <span class="atv-inning-num">7</span>
    </div>
    <div class="atv-section">
      <div class="atv-label">Balls</div>
      <div class="atv-dots">
        <span class="atv-dot on-ball"></span>
        <span class="atv-dot on-ball"></span>
        <span class="atv-dot"></span>
      </div>
    </div>
    <div class="atv-section">
      <div class="atv-label">Strikes</div>
      <div class="atv-dots">
        <span class="atv-dot on-strike"></span>
        <span class="atv-dot"></span>
      </div>
    </div>
    <div class="atv-section">
      <div class="atv-label">Outs</div>
      <div class="atv-dots">
        <span class="atv-dot on-out"></span>
        <span class="atv-dot"></span>
      </div>
    </div>
  </div>
</body>
</html>
